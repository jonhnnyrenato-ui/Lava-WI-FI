<body>

<div class="container">

    <div class="title">
        Lava<span class="e-orange">ê</span>
    </div>

    <div class="wifi-title">
        Wi-Fi
    </div>

    <form id="wifiForm">

        <input
            type="text"
            name="entry.983851513"
            placeholder="Nome completo"
            required
            oninput="this.value=this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g,'')"
        >

        <input
            type="tel"
            name="entry.1159317823"
            placeholder="WhatsApp (somente números)"
            required
            maxlength="11"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
        >

        <button type="submit">
            Conectar
        </button>

    </form>

    <div id="mensagem">
        ✅ Cadastro realizado com sucesso!<br>
        Conectando...
    </div>

    <div class="terms">
        Ao acessar, você concorda com os termos de uso do Wi-Fi Lavaê.
    </div>

</div>

<script>

const FORM_URL =
"https://docs.google.com/forms/d/e/1FAIpQLSdCDRGBJj06NdDsW6LxSvoe9_ZiYbNnlkVtPw02iKNnamoVwg/formResponse";

document.addEventListener("DOMContentLoaded", function(){

    const form = document.getElementById("wifiForm");

    form.addEventListener("submit", async function(e){

        e.preventDefault();

        const dados = new FormData(form);

        try {

            await fetch(FORM_URL, {
                method: "POST",
                mode: "no-cors",
                body: dados
            });

            document.getElementById("mensagem").style.display = "block";

            form.reset();

            setTimeout(function(){

                window.location.replace("https://www.google.com");

            }, 2000);

        } catch(err){

            alert("Erro ao enviar cadastro. Tente novamente.");

            console.error(err);

        }

    });

});

</script>

</body>
</html>
